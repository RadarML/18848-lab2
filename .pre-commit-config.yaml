repos:
  - repo: local
    hooks:
      - id: ruff
        name: Lint with ruff
        entry: uv run ruff check
        language: system
        types: [python]

      - id: pyright
        name: Type check with pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: Run pytest
        entry: uv run pytest -n 8 tests
        language: system
        types: [python]
        pass_filenames: false

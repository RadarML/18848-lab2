[project]
name = "18-848-lab2"
version = "0.0.0"
description = "18-848 Lab 2: Model Training"
requires-python = "==3.12.*"

dependencies = [
    # Indirect dependencies
    # Explicitly specify here to pin versions & explicitly install
    "torch == 2.12.0",
    "torchvision == 0.27.0",
    "numpy >= 1.19",
    "scipy >= 1.10.0",
    "matplotlib >= 3.0.0",
    "torch-geometric == 2.8.0",
    "pyg_lib",

    # Direct dependencies
    "nrdk[roverd] == 0.3.2",
    "roverd[video] == 0.3.5",
    "xwr == 0.5.0",
    "pyyaml >= 5.0.0",
    "hydra-core >= 1.3.0",
    "lightning >= 2.5.5",
    "ipykernel",
    "tensorboard",
    "rich",
    "tyro >= 0.8.0",
    "tqdm",
    "wadler-lindig",

    # Development & orchestration
    "pre-commit >= 4.0.0",
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "coverage",
    "pyright >= 1.0.0",
    "ruff >= 0.10.0",
    "jinja2 >= 3.1.6",
]

[tool.uv]
find-links = [
    "https://data.pyg.org/whl/torch-2.12.0+cu130.html"
]

[tool.uv.sources]
nrdk = { path = "nrdk", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 80
indent-width = 4

[tool.ruff.lint]
select = [
    "E", "F", "W", "N", "I", "D", "NPY"
]
ignore = [
    "D102",  # Inheriting docstrings is allowed
    "D107",  # Initializer goes in the class docstring
    "D401",  # "Imperative mood" NLP doesn't always make sense
    "D413",  # No blank lines after section is preferred by mkdocstrings
    "N806",  # We do math, so capitalization should be allowed
    "E402",  # Module level imports sometimes need to occur after configuration
    "F722",  # Jaxtyping annotations confuse ruff
    "F821",

    # Must pick one...
    "D213",  # Pick 'multi-line-summary-first-line'.
    "D203",  # Pick `no-blank-line-before-class`.
]

[tool.coverage.report]
exclude_also = [
    '^\s*\.\.\.\s*$',
    'def __repr__',
    'if __name__ == .__main__.:',
    'class .*\bProtocol\):',
    'raise NotImplementedError',
]

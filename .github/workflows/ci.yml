name: Run CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install uv with Python 3.12
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: |
        uv sync --frozen

    - name: Lint with ruff
      run: |
        uv run ruff check ./tests ./grt

    - name: Type check with pyright
      run: |
        uv run pyright ./tests ./grt

    - name: Run tests
      run: |
        uv run pytest -n 8 tests

# Radar signal processing, GPU-side (batch stage).
#
# The sample stage only passes the raw IQ through so it survives collate; the
# RSP itself runs on the batched tensor in `batch`.
sample:
  outputs:
    radar: radar

batch:
  rsp:
    inputs:
      iq: radar
    output: spectrum
    transform:
      _target_: nrdk.roverd.TorchSpectrum
      rsp:
        _target_: xwr.rsp.torch.AWR1843Boost
        window: False  # no windowing
        size:
          elevation: ${array.elevation}
          azimuth: ${array.azimuth}
      rep:
        _target_: xwr.nn.PhaseVec
        scale: 1e-6
        transform: sqrt
